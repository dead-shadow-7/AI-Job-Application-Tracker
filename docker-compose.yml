name: ai-job-tracker

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: jobtracker
      POSTGRES_PASSWORD: jobtracker
      POSTGRES_DB: jobtracker
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobtracker -d jobtracker"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    env_file:
      - .env
    # DATABASE_URL and MIGRATION_DATABASE_URL come from .env and are NOT
    # overridden here, so the running app can be pointed at Supabase without
    # editing this file.
    #
    # The test suite does not read them — see backend/tests/conftest.py. It
    # binds to the local container explicitly, because it drops and recreates
    # its database on every run and inheriting a remote URL would aim that at
    # real data.
    environment:
      # Local fallbacks only, used when .env is absent.
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://app_user:app_password@db:5432/jobtracker}
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:-postgresql+asyncpg://jobtracker:jobtracker@db:5432/jobtracker}
    ports:
      - "8000:8000"
    volumes:
      # Bind-mount source for hot reload; keep the image's venv out of the way.
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    command: >
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  pgdata:
