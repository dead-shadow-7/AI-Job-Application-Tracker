[project]
name = "ai-job-tracker-backend"
version = "0.1.0"
description = "AI-assisted job application tracker — FastAPI backend"
requires-python = ">=3.12,<3.14"

# Pinned to <3.14 deliberately: the Phase 3 embedding stack (fastembed →
# onnxruntime) has no 3.14 wheels yet. The Docker image is 3.12 to match.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pyjwt[crypto]>=2.9",
    "httpx>=0.27",
    "python-json-logger>=2.0",
    # LangGraph orchestrates the ingestion DAG; LangSmith gives per-run tracing
    # and token cost. The floors are 1.x because langchain-core 1.x requires it
    # — these three move together and cannot be pinned independently.
    "langgraph>=1.2.11",
    "langsmith>=0.3.45",
    # The transport for every model call. One ChatOpenAI pointed at three base
    # URLs, matching the provider table in core/config.py.
    #
    # Deliberately no langchain-groq. ChatGroq defaults to method="function_calling"
    # and silently downgrades strict=True to None for every model except two —
    # which is precisely the failure this codebase pins its own response_format
    # to avoid. ChatOpenAI defaults to json_schema and raises rather than
    # degrading, so the provider's own base URL is the safer route to Groq.
    #
    # No `langchain` either: that package exists for create_agent, and the
    # assistant loop is deliberately not one. See agent/assistant.py.
    "langchain-core>=1.6.1",
    "langchain-openai>=1.6.0",
    # Pinned below 3 on purpose. openai 3.x is built on the `httpx2`
    # distribution, and objects handed to the SDK client must come from the same
    # httpx as the SDK uses. Staying on 2.x keeps the pooled, event-loop-keyed
    # AsyncClient in agent/llm_client.py injectable as `http_async_client`,
    # which is what carries the connection pool, the split connect/read timeout
    # and the loop keying across from the hand-rolled client. Lifting this pin
    # is not a version bump; it is a rehoming of all three.
    # tests/test_dependencies.py fails the day it drifts.
    "openai>=2.45,<3",
    # Phase 3. fastembed runs BAAI/bge-small-en-v1.5 locally on ONNX — no
    # PyTorch, no API key, no per-call cost, and no third party sees a resume.
    # This is why the image pins Python 3.12: onnxruntime publishes no wheels
    # for 3.13/3.14.
    "fastembed>=0.4",
    "pgvector>=0.3",
    "pypdf>=5.1",
    "python-docx>=1.1",
    "python-multipart>=0.0.20",  # FastAPI UploadFile for resume uploads
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "asgi-lifespan>=2.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.ruff.lint.flake8-bugbear]
# B008 flags function calls in argument defaults. For FastAPI that idiom *is*
# the dependency-injection API, so exempt the injectors rather than litter
# every route with noqa.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Security",
]

[tool.ruff.lint.per-file-ignores]
# Alembic revision identifiers and generated column definitions are long by
# nature; wrapping them hurts diff readability.
"alembic/versions/*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# Required for `from tests.factories import ...` to resolve.
#
# `python -m pytest` puts the working directory on sys.path; a bare `pytest`
# does not. Relying on the former means the suite passes locally and fails in
# CI with ModuleNotFoundError — which is exactly what happened. Declaring the
# path here makes both invocations behave identically.
pythonpath = ["."]
